# Editable surface for hillclimbing: model, budget and API parameters.
backend = "claude"            # "claude" | "channel_freq" | "novelty" | "random"
model = "claude-sonnet-5-5"
max_tokens = 4000
max_retries = 4
use_interests = true        # add interests.md to the profile (wys rank/discover; evals need --with-interests)

# Passed straight through to messages.create(), e.g. an effort setting or temperature.
# Check the current API docs for the exact parameter shape before adding one.
[extra_params]

[profile]                     # arguments to watchyourstep.profile.build_profile
window_days = 180
top_channels = 25
recent_titles = 60

# USD per million tokens, used for cost reporting. Fill in from the current pricing page.
[pricing."claude-sonnet-5-5"]
input = 2.0
output = 10.0
