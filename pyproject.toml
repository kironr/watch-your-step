[project]
name = "watchyourstep"
version = "0.1.0"
description = "Watch Your Step: personal YouTube recommendations from your Takeout history, ranked by Claude, with an eval + hillclimb harness"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70"]

[project.scripts]
wys = "watchyourstep.cli:main"
watchyourstep = "watchyourstep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["watchyourstep*", "evals*"]
